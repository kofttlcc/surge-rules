name: Build Shadowrocket rules

on:
  workflow_dispatch:
  schedule:
    # 09:30 Asia/Shanghai, after the upstream daily build.
    - cron: "30 1 * * *"
  push:
    branches: [master]
    paths:
      - .github/workflows/shadowrocket.yml
      - scripts/build_shadowrocket.py
      - tests/test_shadowrocket.py
      - coustom-direct
      - LICENSE

permissions:
  contents: write

concurrency:
  group: shadowrocket-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Check out one upstream release snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Loyalsoldier/surge-rules
          ref: release
          path: upstream-release
          persist-credentials: false

      - name: Test converter
        run: python3 -m unittest discover -s tests -v

      - name: Build and validate every ruleset
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/build_shadowrocket.py \
            --source-dir upstream-release \
            --output-dir "$RUNNER_TEMP/shadowrocket-output" \
            --upstream-sha "$(git -C upstream-release rev-parse HEAD)" \
            --repository "$TARGET_REPOSITORY" \
            --custom-direct coustom-direct

      - name: Publish validated output
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/shadowrocket-output
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git ls-remote --heads origin shadowrocket-release > "$RUNNER_TEMP/shadowrocket-ref"
          if test -s "$RUNNER_TEMP/shadowrocket-ref"; then
            git fetch origin shadowrocket-release
            git worktree add --detach "$RUNNER_TEMP/shadowrocket-publish" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/shadowrocket-publish" HEAD
            git -C "$RUNNER_TEMP/shadowrocket-publish" checkout --orphan shadowrocket-initial
          fi
          cd "$RUNNER_TEMP/shadowrocket-publish"
          git rm -rf --ignore-unmatch .
          cp -a "$OUTPUT_DIRECTORY/." .
          git add -A
          if git diff --cached --quiet; then
            echo 'Upstream rules and configuration are unchanged.'
            exit 0
          fi
          git commit -m 'Update Shadowrocket rules from verified upstream snapshot'
          git push origin HEAD:refs/heads/shadowrocket-release

# Shadowrocket for iOS — generated configuration
# PROXY uses your existing selected node; this file contains no node credentials.
# Use configuration routing mode. Unknown destinations default to PROXY.
# Lite omits the reject list.

[General]
dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true

[Rule]
# Custom direct exceptions take precedence over every remote list.
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/custom-direct.list,DIRECT
# Local IP destinations are direct; no-resolve avoids triggering DNS here.
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
IP-CIDR,::1/128,DIRECT,no-resolve
IP-CIDR,fc00::/7,DIRECT,no-resolve
IP-CIDR,fe80::/10,DIRECT,no-resolve
IP-CIDR,ff00::/8,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/private.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/icloud.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/apple.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/proxy.list,PROXY
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/telegramcidr.list,PROXY
# China CIDRs allow DNS resolution for domains not covered above.
RULE-SET,https://raw.githubusercontent.com/kofttlcc/surge-rules/shadowrocket-release/rules/cncidr.list,DIRECT
FINAL,PROXY
